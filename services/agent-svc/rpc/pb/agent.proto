syntax = "proto3";

package agent;

option go_package = "agentmesh/agent-svc/rpc/pb/agentpb";

// Message represents a single chat message
message Message {
  string id = 1;
  string conversation_id = 2;
  string role = 3;          // "user" or "assistant"
  string content = 4;
  int64 created_at = 5;
}

// Conversation represents a chat conversation
message Conversation {
  string id = 1;
  string tenant_id = 2;
  string user_id = 3;
  string title = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
}

// ChatRequest for streaming chat
message ChatRequest {
  string tenant_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  string message = 4;
}

// ChatResponse for streaming chat response
message ChatResponse {
  string content = 1;
  bool done = 2;
}

// CreateConversationRequest for creating a new conversation
message CreateConversationRequest {
  string tenant_id = 1;
  string user_id = 2;
  string title = 3;
}

// CreateConversationResponse returns the created conversation
message CreateConversationResponse {
  Conversation conversation = 1;
}

// ListConversationsRequest for listing conversations
message ListConversationsRequest {
  string tenant_id = 1;
  string user_id = 2;
}

// ListConversationsResponse returns list of conversations
message ListConversationsResponse {
  repeated Conversation conversations = 1;
}

// GetMessagesRequest for getting messages in a conversation
message GetMessagesRequest {
  string conversation_id = 1;
}

// GetMessagesResponse returns list of messages
message GetMessagesResponse {
  repeated Message messages = 1;
}

// Agent service definition
service Agent {
  // Streaming chat RPC
  rpc Chat(ChatRequest) returns (stream ChatResponse);

  // Create a new conversation
  rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse);

  // List all conversations for a tenant and user
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);

  // Get all messages in a conversation
  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse);
}
