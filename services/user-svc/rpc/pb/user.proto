syntax = "proto3";

package pb;

option go_package = "agentmesh/user-svc/rpc/pb";

import "google/protobuf/timestamp.proto";

// User message
message User {
  int64 id = 1;
  int64 tenant_id = 2;
  string username = 3;
  string email = 4;
  string nickname = 5;
  string avatar = 6;
  int32 status = 7;
  string role = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// Login request
message LoginRequest {
  string username = 1;
  string password = 2;
}

// Login response
message LoginResponse {
  string token = 1;
  User user = 2;
}

// Register request
message RegisterRequest {
  string username = 1;
  string password = 2;
  string email = 3;
  string nickname = 4;
  int64 tenant_id = 5;
  string role = 6;
}

// Register response
message RegisterResponse {
  User user = 1;
}

// GetUser request
message GetUserRequest {
  int64 id = 1;
}

// GetUser response
message GetUserResponse {
  User user = 1;
}

// UpdateUser request
message UpdateUserRequest {
  int64 id = 1;
  string email = 2;
  string nickname = 3;
  string avatar = 4;
  int32 status = 5;
}

// UpdateUser response
message UpdateUserResponse {
  User user = 1;
}

// User service
service UserService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
}
